name: Cache README Assets

# Snapshots rate-limit-prone / third-party widget SVGs into this repo's `assets`
# branch on a schedule. The README then serves the LOCAL copies (GitHub's own
# infrastructure) instead of the shared public instances, which insulates the
# profile from rate limits and outages. If a refresh fetch fails or returns an
# error card, the previous good copy is kept (last-good wins).
#
# To cache another widget later: add one `refresh "<name>" "<url>"` line below
# and point the README <img> at
# https://raw.githubusercontent.com/<owner>/<repo>/assets/<name>.svg

on:
  schedule:
    - cron: "0 6 * * *"      # refresh once daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cache-assets.yml"]

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Restore existing cached assets (keep last-good)
        run: |
          mkdir -p dist
          if git clone --depth 1 --branch assets "https://github.com/${{ github.repository }}.git" existing 2>/dev/null; then
            cp existing/*.svg dist/ 2>/dev/null || true
            echo "Restored $(ls dist | wc -l) existing asset(s)."
          else
            echo "No assets branch yet — first run."
          fi

      - name: Refresh widget snapshots
        run: |
          refresh() {
            name="$1"; url="$2"; ok=0
            for attempt in 1 2 3; do
              if curl -fsSL --max-time 60 -A "Mozilla/5.0" "$url" -o tmp.svg \
                 && grep -qi "<svg" tmp.svg \
                 && ! grep -qiE 'rate limit|maximum retries|something went wrong|bad credentials|could not fetch' tmp.svg \
                 && [ "$(wc -c < tmp.svg)" -gt 300 ]; then
                mv tmp.svg "dist/$name.svg"; echo "OK   refreshed $name"; ok=1; break
              fi
              echo "...  retry $name ($attempt)"; sleep 5
            done
            [ "$ok" = "0" ] && echo "WARN keeping last-good for $name"
            rm -f tmp.svg
          }

          # --- cached widgets (name | url) ---
          refresh "stats"     "https://github-readme-stats.vercel.app/api?username=MANVENDRA-github&show_icons=true&include_all_commits=true&hide_border=true&rank_icon=github&theme=tokyonight&bg_color=1a1b27&title_color=7aa2f7&icon_color=bb9af7&text_color=c0caf5"
          refresh "top-langs" "https://github-readme-stats.vercel.app/api/top-langs/?username=MANVENDRA-github&layout=compact&langs_count=10&hide_border=true&theme=tokyonight&bg_color=1a1b27&title_color=7aa2f7&text_color=c0caf5"
          refresh "header"         "https://capsule-render.vercel.app/api?type=waving&color=0:1a1b27,50:7aa2f7,100:bb9af7&height=200&section=header&text=Manvendra%20Kumar%20Singh&fontSize=42&fontColor=c0caf5&animation=fadeIn&fontAlignY=38&desc=I%20build%20production-grade%20AI%20agents%20and%20LLM%20tooling&descAlignY=58&descSize=18"
          refresh "footer"         "https://capsule-render.vercel.app/api?type=waving&color=0:bb9af7,50:7aa2f7,100:1a1b27&height=120&section=footer"
          refresh "typing"         "https://readme-typing-svg.demolab.com?font=Fira+Code&size=22&pause=1000&color=7AA2F7&center=true&vCenter=true&width=620&height=45&lines=Building+production-grade+AI+agents;Designing+LLM+tooling+%26+gateways;Shipping+ideas+from+dev+to+prod;Patience+%2B+git+commit+-m+%22final+fix%22"
          refresh "streak"         "https://streak-stats.demolab.com?user=MANVENDRA-github&theme=tokyonight&hide_border=true"
          refresh "activity"       "https://github-readme-activity-graph.vercel.app/graph?username=MANVENDRA-github&theme=tokyo-night&hide_border=true&bg_color=1a1b27&color=c0caf5&line=7aa2f7&point=bb9af7&area=true&area_color=7aa2f7"
          refresh "langs-repos"    "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=MANVENDRA-github&theme=tokyonight"
          refresh "langs-commits"  "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=MANVENDRA-github&theme=tokyonight"
          refresh "productive-time" "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=MANVENDRA-github&theme=tokyonight&utcOffset=5.5"

          echo "=== assets to publish ==="; ls -la dist

      - name: Publish to assets branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: assets
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
